[advisories]
# Tauri's lockfile contains GTK3 dependencies for non-Windows targets. They are not
# linked into the Windows executable, but cargo-audit evaluates the cross-platform lockfile.
ignore = [
  "RUSTSEC-2024-0370",
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  "RUSTSEC-2024-0429",

  # urlpattern currently brings these unmaintained UNIC crates into Tauri's Windows
  # dependency graph. They have no known vulnerability and no compatible replacement
  # can be selected by this application. Every advisory not listed here fails CI.
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
]
